name: 智分Design Windows构建

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 设置Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: 安装依赖
      run: npm ci
    
    - name: 编译TypeScript
      run: npm run build
    
    - name: 验证编译输出
      run: |
        if (Test-Path "dist/main/main.js") { Write-Host "主进程编译成功" } else { Write-Error "主进程编译失败" }
        if (Test-Path "dist/renderer/index.js") { Write-Host "渲染进程编译成功" } else { Write-Error "渲染进程编译失败" }
    
    - name: 创建图标目录
      run: |
        if (!(Test-Path "build")) { New-Item -ItemType Directory -Path "build" }
    
    - name: 生成应用图标
      run: |
        Add-Type -AssemblyName System.Drawing
        $bmp = New-Object System.Drawing.Bitmap(256, 256)
        $g = [System.Drawing.Graphics]::FromImage($bmp)
        $g.Clear([System.Drawing.Color]::FromArgb(14, 99, 156))
        $font = New-Object System.Drawing.Font("Arial", 80, [System.Drawing.FontStyle]::Bold)
        $brush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::White)
        $sf = New-Object System.Drawing.StringFormat
        $sf.Alignment = [System.Drawing.StringAlignment]::Center
        $sf.LineAlignment = [System.Drawing.StringAlignment]::Center
        $g.DrawString("智", $font, $brush, 128, 128, $sf)
        $g.Dispose()
        $bmp.Save("build/icon.png", [System.Drawing.Imaging.ImageFormat]::Png)
        $bmp.Dispose()
        Write-Host "图标已生成"
    
    - name: 构建Windows安装包
      run: npm run dist
      env:
        CI: false
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: 列出构建产物
      run: |
        Get-ChildItem -Path "release" -Recurse | Select-Object FullName, Length
    
    - name: 上传安装包
      uses: actions/upload-artifact@v4
      with:
        name: 智分Design-Windows-Setup
        path: release/*.exe
        retention-days: 30
    
    - name: 上传免安装版
      uses: actions/upload-artifact@v4
      with:
        name: 智分Design-Windows-Portable
        path: release/win-unpacked/
        retention-days: 30
