name: 智分Design Windows构建

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装Qt 5.15.2
      uses: jurplel/install-qt-action@v3
      with:
        version: '5.15.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        modules: 'qtsvg qttools'
        cache: true

    - name: 设置MSVC环境
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: 配置CMake
      run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

    - name: 编译
      run: cmake --build build --config Release --parallel 4

    - name: 验证编译输出
      run: |
        if (Test-Path "build/Release/智分Design.exe") { Write-Host "可执行文件编译成功" } else { Write-Error "可执行文件未找到" }

    - name: 部署Qt依赖
      run: |
        windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw build/Release/智分Design.exe

    - name: 准备安装包目录
      run: |
        New-Item -ItemType Directory -Path "installer/Output" -Force
        Copy-Item -Path "build/Release/*" -Destination "installer/Output" -Recurse -Force

    - name: 安装Inno Setup
      run: choco install innosetup -y --no-progress

    - name: 打包安装包
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/setup.iss

    - name: 列出构建产物
      run: |
        Get-ChildItem -Path "release" -Recurse | Select-Object FullName, Length

    - name: 上传安装包
      uses: actions/upload-artifact@v4
      with:
        name: 智分Design-Windows-Setup
        path: release/*.exe
        retention-days: 30

    - name: 上传免安装版
      uses: actions/upload-artifact@v4
      with:
        name: 智分Design-Windows-Portable
        path: build/Release/
        retention-days: 30
